<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=./?page=login" />
    <title>Sahara City - Secure Admin Console Gateway</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #05080e;
        color: #c5a880;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .loader-container {
        text-align: center;
      }
      .logo-title {
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 8px;
        color: #ffffff;
      }
      .subtitle {
        font-size: 11px;
        font-family: monospace;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #c5a880;
        margin-bottom: 24px;
      }
      .bar-loader {
        width: 160px;
        height: 3px;
        background-color: rgba(197, 168, 128, 0.2);
        border-radius: 9px;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
      }
      .bar-loader::after {
        content: "";
        display: block;
        width: 60px;
        height: 100%;
        background-color: #c5a880;
        position: absolute;
        animation: loading-bar 1.2s infinite ease-in-out;
      }
      @keyframes loading-bar {
        0% { left: -60px; }
        100% { left: 160px; }
      }
    </style>
    <script type="text/javascript">
      // Perform immediate redirect preserving any relative query params or paths
      const searchParams = new URLSearchParams(window.location.search);
      searchParams.set('page', 'login');
      window.location.replace('./?' + searchParams.toString());
    </script>
  </head>
  <body>
    <div class="loader-container">
      <div class="logo-title">SAHARA CITY</div>
      <div class="subtitle">Secure Console Connection</div>
      <div class="bar-loader"></div>
    </div>
  </body>
</html>
